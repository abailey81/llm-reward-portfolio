[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reward-portfolio"
version = "0.1.0"
description = "LLM-driven reward engineering with distributional tail-risk feedback for risk-sensitive deep-RL portfolio allocation (MSc dissertation, UCL IFT)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Tamer Atesyakar" }]

# Versions are PINNED for reproducibility. The hard constraint is the
# torch <-> d3rlpy 2.8.1 compatibility; confirm the exact torch build in the
# Phase 0 smoke test on the RTX 4090 and record it in docs/DECISION_LOG.md.
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",          # Ledoit-Wolf shrinkage, clustering for HRP
    "pyyaml>=6.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",     # SAC (headline), PPO, TD3
    "sb3-contrib>=2.3",           # TQC (secondary distributional-critic experiment, audit A-2)
    "d3rlpy==2.8.1",              # IQN-SAC — OPTIONAL verification only; NOT the headline
    "torch>=2.2",                 # pin to a d3rlpy-2.8.1-compatible build in Phase 0
    "openai>=1.30",               # LLM client transport (matches src/llm/client.make_openai_transport).
                                  #   NOTE: provider is OPEN — ADR-016 (B line) pinned a Claude snapshot;
                                  #   the live client is OpenAI-backed. Reconcile before Phase-1 freeze (ADR-024).
    "matplotlib>=3.8",
    "statsmodels>=0.14",          # bootstrap / inference helpers
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
data = [                          # data_pipeline/ (Refinitiv→gold acquisition) + the real-gold loader
    "lseg-data>=2.0",             # Refinitiv/LSEG RDP SDK (acquisition; ADR-013)
    "pandas-market-calendars>=4.5",  # XNYS trading-day alignment
    "python-dotenv>=1.0",         # reads Refinitiv creds from .env
    "pyarrow>=15",                # parquet IO for the gold panel
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests that train an agent (deselect with '-m \"not slow\"')",
    "phase0: smoke-test gate",
    "integration: full-loop integration test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
