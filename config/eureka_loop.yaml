# Eureka-style search loop — anchors: Ma et al. (ICLR 2024); ADR-004 for restarts & dev-split search.
# PREREGISTRATION.md §4 makes these numbers the DSR trial count. Changing them post-freeze = deviation.
loop:
  iterations: 5                # N — Eureka default
  samples_per_iteration: 16    # K — i.i.d. candidates; >=1 executable w.h.p. (Eureka §exec-filtering)
  restarts: 3                  # R — Eureka used 5; 3 per ADR-004 compute bound
  temperature: 1.0             # Eureka sampling regime; verify against App. A before first run (docs/notes/eureka.md)
  keep_best_across_iterations: true

contract:
  require_component_dict: true   # reward must expose components — enables reflection + forensics chapter
  numpy_only: true               # candidate code may import numpy ONLY (sandbox enforces)
  max_abs_reward: 1.0e6
  archive_dir: data/candidates   # every prompt/response/candidate archived verbatim (CLAUDE.md R6)

arms:                            # legacy blueprint budget = iterations*samples*restarts = 240 (ADR-004).
  # NB: this eureka_loop.yaml is the documentary blueprint and is NOT loaded by the live run. The
  # LIVE matched budget is set in config/{prototype,campaign}.yaml (40 prototype / 30 campaign), and
  # the live arm set (config/arms.yaml) uses the names distributional/scalar/placebo/scalar_cvar5/
  # random_search/bayes_opt. Numbers below are the historical blueprint, retained for provenance.
  - llm_distributional           # reflection = prompts/reflection.txt + distributional {ARM_BLOCK} (schema.build_block)
  - llm_scalar                   # reflection = prompts/reflection.txt + scalar {ARM_BLOCK} (schema.build_block)  (H2 ablation)
  - llm_single_shot              # one-shot samples at the matched budget, no reflection   (H3)
  - random_search                # H4a: random draws over the six-primitive reward grammar (matched budget)
  - bayes_opt                    # H4b: GP-EI Bayesian optimisation (Matern-2.5; Snoek et al. 2012) over the same family

baseline_rewards:                # hand-designed canon (citations in src/baselines/rewards.py docstrings)
  # The full 9-name SECONDARY panel (PREREGISTRATION §9). Every name MUST be a real key in
  # src/baselines/rewards.py::REWARD_CANON (the branch resolves via getattr(rewards, name)); the
  # previous list had 5/6 STALE names that would AttributeError (log_wealth/sharpe_episodic/
  # cvar_penalised_mean/drawdown_penalised/turnover_penalised — fixed to the real names below;
  # sharpe_episodic DROPPED, it has no REWARD_CANON function). The FROZEN H1 family is the 4-name
  # subset in config/campaign.yaml::h1_baselines; this 9-name set is the documented secondary panel.
  - raw_return                   # myopic bare portfolio return
  - return_minus_variance        # mean-variance penalty
  - return_minus_cvar            # tail-risk (CVaR) penalty   (was: cvar_penalised_mean)
  - differential_sharpe          # Moody & Saffell online incremental Sharpe — primary baseline
  - mean_variance_utility        # Markowitz quadratic utility
  - return_minus_drawdown        # running-drawdown penalty   (was: drawdown_penalised)
  - return_minus_downside        # Sortino downside semi-deviation penalty
  - return_minus_turnover        # transaction-cost / turnover penalty  (was: turnover_penalised)
  - log_growth                   # Kelly growth-optimal log return  (was: log_wealth)

reward_family:                   # H4 SHARED six-primitive space (ADR-010; PREREGISTRATION §4a).
  # Six-term linear family implemented in src/baselines/reward_family.py. Exactly which dimensions
  # each H4 arm searches over THIS family's six primitives (return, log, turnover, drawdown, cvar, vol):
  #   - bayes_opt (H4b):     GP-EI tunes the six continuous WEIGHTS; the discrete dims (cvar_alpha,
  #                          window) are FIXED at (0.05, 20) because the GP box is continuous-only.
  #   - random_search (H4a): draws the six WEIGHTS uniformly from a coarse grid over the SAME ranges,
  #                          at the SAME fixed (cvar_alpha=0.05, window=20) — a procedure-only control
  #                          at comparable expressive power to H4b (src/search/random_search.py).
  # NOTE: the family's vertices recover the hand-designed canon, so H4b is a like-for-like comparison
  # of FREE-FORM LLM code against the BEST member of this fixed parametric family. This does NOT make
  # the LLM-vs-search comparison like-for-like in SEARCH SPACE: the LLM authors free-form code (a
  # strictly richer space), so a positive H4 reflects open-ended-language + procedure, not procedure
  # alone (see docs/DEEP_H4.md §1). Weights sampled UNIFORM over [low, high]; ranges sized so each
  # term can reach ~ +/-0.02 per step (parity with daily net-return scale ~0.01). Changing ranges
  # post-freeze = deviation.
  weights:
    w_return:   {low: 0.0, high: 2.0}     # * net_return
    w_log:      {low: 0.0, high: 2.0}     # * log1p(net_return)
    w_turnover: {low: 0.0, high: 0.02}    # * turnover (one-way, in [0, 1])
    w_drawdown: {low: 0.0, high: 0.1}     # * drawdown level (in [0, 1])
    w_cvar:     {low: 0.0, high: 5.0}     # * max(0, -rolling CVaR_alpha)
    w_vol:      {low: 0.0, high: 2.0}     # * rolling std of net returns
  cvar_alpha: 0.05                        # FIXED discrete dim for BOTH H4 arms (continuous BO box)
  window: 20                              # FIXED rolling window for the CVaR / vol terms (both H4 arms)
