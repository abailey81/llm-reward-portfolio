# Data (FINAL_PLAN D, B.2; audit B-2, C-3). Splits byte-match PREREGISTRATION.md §7.
period: {start: 2005-01-01, end: 2025-12-31}   # full 20 years — NOT a scoping lever
survivorship_free: true
delisting_returns: retain

splits:
  train: {start: 2005-01-01, end: 2014-12-31}   # agent learns + feedback MEASURED here (audit B-2)
  val:   {start: 2015-01-01, end: 2017-12-31}   # selection (held-out Deflated Sharpe)
  test:  {start: 2018-01-01, end: 2025-12-31}   # UNTOUCHED until final inference
embargo_days: 21                                # Lopez de Prado purge+embargo FLOOR (serial-correlation margin).
                                                # Effective inter-split purge = max(embargo_days, lookback_days)
                                                # = max(21, 60) = 60 sessions (R18): the purge must cover the
                                                # 60-day feature lookback so no obs window crosses a split.
                                                #   Reconciled 10->21 (2026-06-19 audit): matches inference.yaml. The
                                                #   MATERIALIZED gold splits record the +21 embargo boundary (2015-02-03);
                                                #   R18: the EXECUTED val start applies the larger lookback purge (~2015-03-31).

vendors: [primary, secondary]                   # two-vendor reconciliation (stage 11)
sources:
  prices_returns: Refinitiv_LSEG_RDP            # ACTUAL vendor (ADR-013/019–022): survivorship-free PIT panel
                                                #   data/gold/returns_panel_univ3.parquet, built by data_pipeline/,
                                                #   loaded via src/data/loaders.py. (CRSP/WRDS was the originally-
                                                #   planned source; see ../01_literature/DATASETS.md.)
  vix: FRED_VIXCLS                              # CBOE .VIX not licensed → FRED VIXCLS (cash_features.vix)
  risk_factors: kenneth_french_data_library     # factor attribution
  macro_regime: FRED_ALFRED                      # point-in-time vintages (no revision look-ahead)

freeze: {checksum: sha256}
licensing: redistribution_prohibited            # ship checksums + pipeline + SYNTHETIC panel, NOT the data (audit C-3)
