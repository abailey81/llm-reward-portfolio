# Machine-readable mirror of PREREGISTRATION.md. FROZEN at end of Phase 1; scripts/freeze.py hashes
# it into docs/DECISION_LOG.md and asserts it agrees with the prose record. Changes after freeze
# require a dated amendment entry.
frozen: false                         # flips true at the Phase-1 freeze
freeze_hash: null                     # SHA-256, emitted by scripts/freeze.py
phase0_smoke_passed_log_id: "DECISION_LOG.md#PHASE-0 (GREEN 2026-06-17)"   # precondition MET (P2; CPU m≈18.9/25.9)

hypotheses: [H1, H2, H3, H4]          # H2 headline; secondary = SAC-vs-TQC critic
contribution_axis: feedback_channel   # audit A-1: agent fixed (SAC), feedback varies

arms: [distributional, scalar, placebo, scalar_cvar5, placebo_shuffled, random_search, bayes_opt]   # 7 arms; placebo_shuffled = the R32 structure-vs-content control (V1 reconcile 2026-06-26: was silently missing from the frozen roster while the campaign ran 7). DISJOINT from the m=6 testing family.
matched_budget: 30
# Amendment E1 (2026-07-10, supervisor-approved; PREREGISTRATION §6/§12 + amendment record): per-arm
# WINNER seed count is the ASSURANCE-TIER LADDER (mode: tiered), resolving to the flat set [0..567].
# SEARCH budget untouched (1 seed per candidate during search; only the winners re-run at these seeds —
# the seeds-on-winners lever, ADR-023). Cumulative, order-only tiers (CRN preserved, each a COMPLETE
# study; truncation falls back to the largest COMPLETED rung): 30 core / 100 sigma-precision /
# 189 point-estimate power / 279 (80%) / 340 (90%) / 403 (95%, primary target) / 568 (99%). Stopping
# tier is EXOGENOUS (measured throughput vs deadline, never results) -> the single look is preserved.
seeds: {mode: tiered, tiers: [30, 100, 189, 279, 340, 403, 568]}

tail_diagnostic_set:                  # measured on TRAINING returns; empirical body + EVT tails
  cvar_levels: [0.25, 0.10, 0.05, 0.01]   # cvar_01 retained but FLAGGED high-variance (B-7)
  evt_levels:  [0.05, 0.01]               # GPD fit for the extremes
  extras: [left_tail_mass, robust_skew]
  reliability_diagnostic: dropped_from_headline   # crossing-rate kept only for optional neural instrument
  moors_kurtosis: excluded
measurement_split: train              # audit B-2
estimator: {body: empirical, tails: gpd_evt}      # audit B-1

fitness:
  metric: validation_deflated_sharpe  # reward-independent (audit B-3)
  lambda_cvar: 0.0                     # optional -lambda * validation CVaR
  selection_split: val

loop: {runs: once, cpcv_on: winners, per_candidate_budget: fixed}   # audit B-3, B-5
# R74 (2026-07-02): B* from the Split-C convergence pilot — R70's extend-until-converged criterion is
# structurally unsatisfiable on this workload (eval flat-within-noise 25k..350k on BOTH ladders; the
# detector's tolerance scales with the curve's own range -> collapses on a flat curve). Totality of
# evidence: critic steep descent done by 100k (0.59->0.10), 350k nominally WORSE than 200k (overfit
# direction), ~17 buffer passes at 200k. Mirrors campaign.yaml + algos.yaml (budget-mirror guard).
train_steps_per_candidate: 200000

# R19 (2026-06-20): de-duped the mislabelled spy_buy_and_hold (== 1/N, no index in the anonymised panel)
# and expanded to 8 DISTINCT published allocators. Names match analyze_campaign._BENCHMARK_NAMES exactly.
benchmarks: [equal_weight, mean_variance, risk_parity, hrp, minimum_variance, maximum_diversification, inverse_volatility, cross_sectional_momentum]

inference:
  primary_overfitting_guard: pbo_cscv
  deflated_sharpe: secondary
  # Amendment 2026-06-19 (R11): relabel "sharpe_ledoit_wolf" -> re-centred basic (empirical) stationary
  # block-bootstrap; the bootstrap SE cancels in the two-sided p-value (|boot-obs| >= |obs|), so size is
  # certified by null_calibration (audit C-7), not studentized. Numerics unchanged (label correction only).
  difference_tests: [sharpe_recentred_bootstrap, cvar_difference]
  bootstrap: stationary_politis_romano        # single-series tool (sharpe/cvar_difference_test)
  # Amendment 2026-06-20 (R16): the arm-contrast FAMILY difference tests aggregate ACROSS SEEDS via the
  # rliable per-seed method — per-seed Sharpe/CVaR -> IQM -> PAIRED stratified bootstrap over the shared
  # training seeds (paired_seed_difference_test), carrying the across-seed variance. This realizes the
  # `seed_reporting: rliable_iqm` intent AT the test and supersedes the prior seed-AVERAGED series
  # bootstrap (anti-conservative ~21% vs the correctly-sized ~5% true-null rejection, measured on a
  # 30-seed calibration sample — this is the method-calibration n, not the campaign winner count). The
  # re-centred convention (R11), the frozen family (R13, m=6), and the correction are unchanged.
  difference_test_unit: per_seed_iqm_paired_seed_bootstrap
  seed_reporting: rliable_iqm_poi_stratified_ci
  multiple_testing: romano_wolf_or_bh_fdr     # cross arm x metric family (audit B-8)
  multiple_testing_primary: benjamini_hochberg # BH q=0.05 primary; joint Romano-Wolf = FWER alternative (R13)
  multiple_testing_q: 0.05
  alpha_hurdle_t: 3.0                          # Harvey-Liu-Zhu — scoped to ABSOLUTE-alpha claims only (R13)
  alpha_hurdle_scope: absolute_alpha_claims_only
  trial_count_stated: true
  claim: comparative_not_beats_market
  # Amendment 2026-06-19 (R13): the realized multiple-testing family is ENUMERATED + FROZEN. It is exactly
  # what scripts/analyze_campaign.collect_family_pvalues enumerates: {arm-contrast x held-out-metric} =
  # 3 H2 contrasts x {Sharpe, CVaR-0.05} = m=6 (incl. the H2 distributional-vs-{scalar, placebo,
  # scalar_cvar5} legs). cvar_01 is opt-in (would grow m to 9), NOT in the frozen default family.
  # analyze_campaign/run_campaign assert the realized contrast set == this family (the `members` union).
  #
  # Amendment 2026-06-25 (R25): the HEADLINE decision is now TWO CO-PRIMARY intersection-union tests
  # (IUTs), NOT one m=6 BH family gated by a conjunction. Berger (1982): a conjunction IS an IUT and is
  # already the multiplicity correction (joint size <= max leg size = alpha), so the old
  # (conjunction o BH-over-6) DOUBLE-corrected and was under-powered against H2 (DEEP_H2 §3.2-3.3). The
  # m=6 enumeration below is UNCHANGED (still the frozen realized-family assert + the BH-over-6 REPORTED
  # SENSITIVITY); what changes is the GATE: it now partitions the 6 into two declared families, each
  # decided one-sided at alpha=0.05 with NO further leg correction (the IUT is the correction). `m: 6`
  # is retained as the union size (the Sidak selection-power multiplicity in scripts/power_analysis.py
  # ranges over all 6 enumerated tests).
  testing_family:
    m: 6                                        # UNION size (BH-over-6 sensitivity + Sidak multiplicity)
    structure: two_co_primary_iut               # R25: H2-RA (Sharpe) + H2-Tail (CVaR-5%), each its own IUT
    decision_rule: per_family_iut_one_sided_no_leg_correction   # the conjunction IS the correction (Berger 1982)
    alpha_one_sided: 0.05                        # each IUT leg decided one-sided in the predicted direction
    bh_over_6: reported_sensitivity_not_gate     # R25: BH over the m=6 union is REPORTED, never the gate
    contrasts:                                 # (a, b) read "a predicted better than b"
      - [distributional, scalar]
      - [distributional, placebo]
      - [distributional, scalar_cvar5]
    metrics: [sharpe, cvar]
    cvar_levels: [0.05]                         # headline alpha; cvar_01 opt-in (high-variance, EVT)
    # The TWO co-primary IUTs (R25). Each is supported iff ALL THREE of its legs reject one-sided at
    # alpha=0.05 in the predicted direction (distributional strictly better). H2-Tail is additionally
    # CORROBORATED (not gated) by the FZ0/(VaR,ES) comparative ES backtest where available.
    families:
      h2_ra:                                    # risk-adjusted-performance IUT (DEEP_H2 §7.1)
        m: 3
        metric: sharpe
        members:
          - {arm_a: distributional, arm_b: scalar,       metric: sharpe, level: null}
          - {arm_a: distributional, arm_b: placebo,      metric: sharpe, level: null}
          - {arm_a: distributional, arm_b: scalar_cvar5, metric: sharpe, level: null}
      h2_tail:                                  # tail-outcome IUT (DEEP_H2 §7.1)
        m: 3
        metric: cvar
        level: 0.05
        corroborated_by: fz0_var_es_comparative_backtest   # reported, NOT a gate
        members:
          - {arm_a: distributional, arm_b: scalar,       metric: cvar, level: 0.05}
          - {arm_a: distributional, arm_b: placebo,      metric: cvar, level: 0.05}
          - {arm_a: distributional, arm_b: scalar_cvar5, metric: cvar, level: 0.05}
    members:                                    # the m=6 enumerated UNION (frozen realized-family assert)
      - {arm_a: distributional, arm_b: scalar,       metric: sharpe, level: null}
      - {arm_a: distributional, arm_b: scalar,       metric: cvar,   level: 0.05}
      - {arm_a: distributional, arm_b: placebo,      metric: sharpe, level: null}
      - {arm_a: distributional, arm_b: placebo,      metric: cvar,   level: 0.05}
      - {arm_a: distributional, arm_b: scalar_cvar5, metric: sharpe, level: null}
      - {arm_a: distributional, arm_b: scalar_cvar5, metric: cvar,   level: 0.05}
  # Amendment 2026-06-19 (R12): SESOI + symmetric TOST equivalence margin for the headline H2 contrast.
  sesoi: 0.05                                   # validation-DSR units
  equivalence_margin: 0.05                      # symmetric TOST margin (+/- DSR)
  # Amendment 2026-06-25 (R26/R30/R31): the PRE-REGISTERED report-only SECONDARY families. ALL use keys DISJOINT
  # from the frozen m=6 above, so analyze_campaign.assert_realized_family_matches_frozen is untouched; each is
  # computed + reported but NEVER gates H2. Pre-registering them BEFORE the sealed-test freeze is what pre-empts
  # the "your edge is just BAB/low-vol" recast (R26; LIMITATIONS_REGISTER L15) and makes H3/H4 campaign-grade (R30).
  secondary_families:
    factor_attribution:                         # R26 — difference-in-alpha vs the factor ladder (the BAB/low-vol pre-empt)
      key: attribution
      ladder: [capm, ff3, carhart4, ff5, ff6, ff6_bab, ff6_bab_qmj]
      statistic: difference_in_alpha_paired_across_seed   # Newey-West (1994) HAC SE; BH WITHIN this family
      controls_for: [market, size, value, momentum, profitability, investment, betting_against_beta, quality]
    h3_iterative_vs_singleshot: {key: h3, statistic: per_seed_iqm_paired, equivalence: tost_0.05}   # R30
    h4_search_controls: {key: h4, tests: [h4a_vs_random_search, h4b_vs_bayes_opt], correction: bonferroni_2}   # R30
    h2_tost_equivalence: {key: h2_tost, margin: 0.05, units: test_statistic}   # R29/R30 — the bankable-null bound
    h2_structure_control:                       # R32 — the format-vs-content structure control (Gupta-Hartford)
      key: h2_structure
      arm: placebo_shuffled                     # the 5th LLM arm: distributional's EXACT block, values DERANGED
      contrast: [distributional, placebo_shuffled]
      metrics: [sharpe, cvar]
      cvar_level: 0.05
      decision: one_sided_both_legs_content_over_format
      gates_h2: false                           # DISJOINT from the frozen m=6 union — reported, NEVER a gate
    dsr_effective_n: {key: dsr_effective_n, report_only: true}   # R30 — sequential-reflective correlation sensitivity
    cross_hypothesis_multiplicity: {key: cross_hypothesis_multiplicity, stance: separate_estimands_bonferroni_4_sensitivity}  # R31
    delisting_band:                             # R33 — the delisting-return sensitivity band (DATA-level; DISJOINT)
      key: delisting_band
      panel: univ4                              # the Shumway panel carrying the 333 delisting cells (NOT the headline — univ5 is, R73); band overwrites
                                                #   them. The univ4-era panel ends 2025-12, so under Split C the band CLAMPS its window to the overlap
                                                #   and records the clamp (analyze_campaign.delisting_band); ADR-051 located the truth AT the 0% end
                                                #   (univ5s == univ5: 333/333 vendor terminals kept, zero surcharges; univ4 = M&A contamination +
                                                #   terminal double-count).
      grid: [0.0, -0.30, -0.55, -1.00]          # delisting-return d applied to the 333 test-window cells; univ4=-30/-55 = the structural extreme
      metrics: [cvar_05, cvar_01]               # pooled tail recomputed per d (DATA-level, NO policy re-run)
      report_only: true
      gates_h2: false                           # DISJOINT from the frozen m=6 union — reported, NEVER a gate

contamination: {blinding: anonymized_arrays, stratify: training_cutoff, second_model: open_weights_diff_cutoff}
# SPLIT C (ADR-044 RATIFIED 2026-07-01; EXECUTED 2026-07-02 with the univ5 rebuild + the settled
# 2026-06-30 cutoff, ADR-051 — a PRE-FREEZE design choice, never results-contingent):
data_splits: {train: [2005, 2016], val: [2017, 2019], test: [2020, 2026]}
# Amendment 2026-06-25 (R33, PREREGISTRATION §7): the HEADLINE data panel is the survivorship-corrected
# R44 (2026-06-26, supersedes R33's univ4 headline): the headline TRAIN/TEST panel is univ3 (liquidate_to_cash /
# zero-fill — NO fabricated losses). univ4 (Shumway 1997: -30% NYSE/AMEX, -55% NASDAQ booked (1+r)(1+dl)-1 on each
# dead name's last valid session; 333 cells of the SAME 953-universe / 5283x953, 0 in the 620 live columns)
# surcharges 100% of the 333 delistings INCLUDING premium M&A (Refinitiv carries no delisting reason/terminal on
# disk), so it FABRICATES left-tail mass in a tail-risk study and is only the M&A-CONTAMINATED heavy END of the
# band (R39). The headline tail INSTRUMENT is the {0,-30,-55,-100%} delisting_band (analyze_campaign.delisting_band):
# the sweep moves pooled test CVaR-5% only ~2% (measured pre-Split-C, 2018-2025 window; re-derived at analyze
# time on the executed window) -> the H2 tail ORDERING is INVARIANT. univ3 is integrity-screened
# via univ3s (R39); univ4r (reason-gated re-pull, M&A keeps last price / failures surcharged,
# docs/DATA_REPULL_DELISTING.md) is the CORRECT panel (recommended, OPTIONAL for H2 since the band is invariant).
# The loader's live default IS univ5 (R73, 2026-07-02); the campaign needs no LLM_RP_GOLD_SUFFIX override.
data_panel:
  headline: univ5                       # R73 (extends R44): zero-fill, NO fabricated losses; Split C, 5406x963 to 2026-06-30
  tail_instrument: delisting_band       # the {0,-30,-55,-100%} sensitivity is the headline tail result (H2 invariant)
  band_zero_end: univ3                  # zero-fill 0% anchor; band computed on the univ3/univ4-era overlap (univ5 == univ3 byte-identically there)
  band_heavy_end: univ4                 # Shumway -30/-55 = the M&A-CONTAMINATED heavy end (R39) + terminal DOUBLE-COUNT (ADR-051), NOT the tail truth
  corrected_panel_executed: univ5s      # ADR-051 (2026-07-02) SUPERSEDES the planned univ4r: observed-terminal recovery, 333/333 vendor_terminal_kept, ZERO surcharges -> univ5s == univ5 byte-identically
  resolves: ADR-024                     # R33 -> R44 -> R73: liquidate_to_cash IS the band-bracketed headline; the corrected panel EQUALS it
algorithms: {headline: sac, secondary_critic: tqc, robustness: [ppo, td3]}

# Amendment 2026-06-19 (R15, PREREGISTRATION §10): cost-robustness sweep. Re-price the FROZEN winners
# across the bps grid WITHOUT retraining (net_c = gross - bps*1e-4*turnover; exact because cost is charged
# after the action), report-only/post-freeze, never re-selecting.
cost_sweep: {grid_bps: [0, 5, 10, 25, 50], metric: [sharpe, cvar_05], method: analytic_reprice, report_only: true}

# ---- 2026-07-02 machine-readable mirror of PREREGISTRATION.md §1 H1 (the four baselines named there;
# hand-reward panel context in §9 — the old "§18" cite was a line-number error, DEEP_H1 C-1) (audit H-L2): the FROZEN H1
# "beat-the-human" baseline family. config/campaign.yaml (NOT hash-bound; its compute knobs stay amendable)
# is what the baseline TEST stage actually reads, so scripts/freeze.py::assert_h1_baselines_match asserts
# campaign.yaml's list equals THIS one — exactly like the arm-roster guard — and the executed family cannot
# silently drift from the frozen §1-H1 family. Post-freeze changes require a dated amendment.
h1_baselines: [raw_return, return_minus_variance, return_minus_cvar, differential_sharpe]

# ---- 2026-06-24 pre-freeze amendments (machine-readable mirror of PREREGISTRATION.md §5 / §6 / §11) ----
# §5 (lambda): fitness.lambda_cvar = 0.0 above (RATIFIED 2026-07-01; the INERT lambda_grid/calibration_fold
#   in config/inference.yaml are to be DELETED at the Phase-1 freeze). §6 + §11 mirrored here:
search:
  reflect_protocol_default: serial_reflect_on_best    # prototype-de-risked SERIAL path (run_campaign.py --search-gpu 0); M5/R32 upgraded its reflection seed to the generation's BEST (src/llm/loop.py:604-615, Eureka-faithful)
  reflect_protocol_parallel: best_of_generation       # --search-gpu>0; Eureka-faithful; buffer==train_steps (50k = TEST)
  headline_reflect_protocol: serial_reflect_on_best   # RATIFIED 2026-07-01 (supersedes R24) + CORRECTED 2026-07-02: headline = SERIAL execution (prototype-de-risked, reproducible; ADR-040 deadline allows the longer run; parallel cache now also resume-safe so reproducibility is EQUAL). The 07-01 text said "reflect-on-last" on a STALE premise — R32/M5 had already made the serial path reflect on the generation's BEST (code-verified 2026-07-02 at src/llm/loop.py:604-615), so the headline is Eureka-faithful and the amendment's "reflect-on-last deviation" disclosure is DISSOLVED. Parallel best-of-generation retained as a now-resume-safe robustness variant.
agent_numerics:
  tf32: true                            # config-driven (config/prototype.yaml agent.tf32, threaded to all 3 trainer legs); default-on, §11

# ---- 2026-07-01 RATIFIED amendment: mechanism-headline reframe (PREREGISTRATION.md §2a) ----
# Report-only, DISJOINT from the frozen m=6 testing family (does NOT gate H1-H4; keys disjoint from the
# inference family). Foregrounds the MECHANISM as the dissertation's headline: does showing the LLM the
# downside change the reward CODE it writes, and does it propagate to the realized tail? A null LOCATES
# where the chain breaks. Robust to the sigma_D pilot: the mechanism headline holds whether H2 lands as
# equivalence OR non-rejection.
mechanism:
  report_only: true
  disjoint_from_m6: true
  research_question: does_fed_tail_change_authored_code_and_propagate_to_realized_tail
  causal_chain: [fed_tail_signal, authored_reward_code, trained_policy, realized_tail_outcome]
  sub_questions:
    sq1_responsiveness:
      question: does_the_fed_signal_move_the_code
      instrument: [responsiveness_spearman_bootstrap, reward_program_differential]
      predicted_direction: positive_if_channel_acts     # prototype responsiveness was negative -> predicted break HERE
    sq2_transmission:
      question: does_the_code_move_the_outcome
      instrument: mediation_fed_to_code_to_outcome_indirect_bootstrap
      note: if_sq1_null_then_indirect_zero_for_any_b     # the chain severs at link 1
    sq3_specificity:
      question: genuine_use_of_tail_content_vs_surface_echo
      instrument: [named_vs_blinded_structural_ast, legible_format_responsiveness_differential]
  numeracy_bottleneck:                  # the headline reframe (ADR-039)
    hypothesis: sq1_failure_is_partly_a_numeric_legibility_bottleneck   # close small floats ~50-70% (arXiv 2602.07812; NUMCoT 2406.02864)
    ablation: legible_format_differential   # positive CI-separated legible-minus-raw gap CONFIRMS; null REFUTES
  robust_to_sigma_d: true               # the mechanism headline does NOT depend on the equivalence-vs-non-rejection pilot outcome

# ---- 2026-07-01 RATIFIED amendment: risk-free numeraire (PREREGISTRATION.md §10) ----
numeraire:
  report_only: true
  headline_risk_free: 0.0               # rf=0 headline (excess == total); cancels to FIRST ORDER in the arm contrast (common-mode)
  idle_cash_daily_rate: 0.0             # config/environment.yaml cash_daily_rate (env prices cash when set; frozen value 0)
  rf_excess_robustness: reported        # DGS3MO-excess sensitivity (analyze_campaign.h2_sharpe_rf_robustness) demonstrates rf-invariance of the H2 ordering
