# LLM reward-designer (FINAL_PLAN E, F.8, K). Pin the snapshot; archive every call (replay, not
# regenerate — audit C-2). The key is read from the environment, NEVER committed.

provider: anthropic                         # CAMPAIGN reward-author = Claude Opus 4.8 (ADR-038, supersedes the
                                            #   ADR-035 Gemini pick); the PROTOTYPE uses Claude Sonnet 4.6 (ADR-038,
                                            #   also native Anthropic SDK / same ANTHROPIC_API_KEY).
model_snapshot: "claude-opus-4-8"           # ADR-038: campaign reward-author = Claude Opus 4.8 (prototype = Sonnet 4.6)
api_key_env: ANTHROPIC_API_KEY              # read from the gitignored .env; NEVER committed
temperature: 1.0                            # Eureka diversity (ADR-016): K candidates/gen share ONE prompt -> temp MUST
                                            #   be > 0 (0 collapses the within-gen search; per-provider diversity per ADR-038:
                                            #   prototype Sonnet 4.6 uses temp=1.0, campaign Opus 4.8 uses prompt-variation)
top_p: 1.0
max_tokens: 4096

# Matched-compute budget (the property that licenses the comparative claim). Same for ALL arms.
candidate_budget_total: 30                  # total reward candidates per arm (set via scoping tree)
generations: 6                              # multi-generation reflection (H3 single-shot uses 1)
candidates_per_generation: 5                # = budget / generations

# N3 contamination control (ADR-033): an open-weights, different-cutoff model whose H2 ORDERING is
# replicated on a separate corpus. ADR-033 names Llama-4 (official Aug-2024 cutoff, commit-pinned);
# DeepSeek-V3-0324 (deepseek-ai/DeepSeek-V3-0324, ADR-016) is the recorded fallback. Pin the EXACT HF
# commit at use time — do NOT fabricate a revision here (CLAUDE.md no-fabrication). Secondary arm, not
# on the primary Pass-B path.
#
# SECOND-MODEL DECIDED (amendment R71, 2026-06-29; model PINNED 2026-07-02) — a multi-model SECONDARY
# robustness panel, NOT co-primary. The single Claude family (Opus 4.8) train-to-convergence run is the
# CONFIRMATORY headline (the `provider`/`model_snapshot`/`api_key_env` block above is that path and stays
# BYTE-UNTOUCHED); a different-family OPEN-WEIGHTS designer is added as a pre-registered SECONDARY,
# REPORT-ONLY panel (headline arms only, reduced seeds) that makes "LLMs" genuine + runs the N3
# `cross_model_disagreement` contamination cross-check. It is NEVER part of the confirmatory family.
#
# PINNED MODEL (decision 2026-07-01, supersedes the Qwen2.5-Coder recommendation): the Qwen3-Coder family
# — strong code authorship, Apache-2.0 open weights, non-Anthropic vendor + different training cutoff —
# served via OPENROUTER (OpenAI-compatible chat-completions at https://openrouter.ai/api/v1; slug below).
#   * key env  = OPENROUTER_API_KEY (gitignored .env; NEVER committed).
#   * REPRODUCIBILITY ANCHOR: OpenRouter routes a slug to a concrete snapshot — the EXACT model/version
#     string the response reports (`response.model`, archived as ProvenanceRecord.served_model) MUST be
#     recorded in the archive at the FIRST live call and quoted in the write-up.
#   * smoke/activation: add OPENROUTER_API_KEY=... to .env, then `python scripts/smoke_qwen.py`.
# ACTIVATION IS KEY- + COMPUTE-GATED + EXPLICIT: until the secondary panel is actually RUN, the MAIN
# single-model campaign path keeps degrading `cross_model_disagreement` to {"status": "no_data"} (honest
# "secondary panel not yet run" — it gates on second-model DATA, not on this pin), NOT a silent skip; the
# secondary panel is a SEPARATE run. Until run, the write-up says "the single Claude family (Sonnet ->
# Opus) for the confirmatory headline; the second-family panel is a pre-registered secondary run."
open_weights_check_model: "qwen/qwen3-coder"  # R71 SECONDARY panel (Qwen3-Coder-480B-A35B, OPEN-WEIGHTS).
                                              #   2026-07-09: reverted DashScope -> OpenRouter. Tamer cannot obtain
                                              #   the Alibaba DashScope key; OpenRouter serves the SAME open-weights
                                              #   model and the transport ARCHIVES the served snapshot
                                              #   (response.model -> ProvenanceRecord.served_model), so it remains a
                                              #   valid reproducibility anchor — the "anchor" is the OPEN-WEIGHTS
                                              #   model (downloadable forever), not the host. A ":free" tier for this
                                              #   slug exists (since 2026-02); ":exacto" pins best tool-calling.
                                              #   SAME-LEVEL-OR-BETTER swaps if preferred (all open-weights, distinct
                                              #   from Opus, via OpenRouter): Kimi K2.6 (moonshotai/kimi-k2.6, MIT —
                                              #   now stronger at coding) or GLM-5.1 (z-ai/glm-5.1, MIT). A model swap
                                              #   needs a one-line prose update (the 2nd-model name), nothing more.
open_weights_provider: openrouter             # OpenAI-compatible transport (src/llm/client.py registry);
                                              #   base URL = https://openrouter.ai/api/v1 (registry default)
open_weights_api_key_env: OPENROUTER_API_KEY  # read from the gitignored .env; NEVER committed. OpenRouter key =
                                              #   simple global signup + card (or the free tier) — no Alibaba account.

archive: true                               # store rendered prompt + raw response + parsed reward per call
archive_dir: outputs/runs                   # keyed by run id (see src/io/results.py)
